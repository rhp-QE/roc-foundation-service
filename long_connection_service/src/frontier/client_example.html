<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket 长连接客户端示例</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 800px;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.2);
        }

        .status.connected {
            background: #4caf50;
        }

        .status.disconnected {
            background: #f44336;
        }

        .content {
            padding: 20px;
        }

        .control-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-danger {
            background: #f44336;
            color: white;
        }

        .btn-danger:hover {
            background: #da190b;
        }

        .btn-success {
            background: #4caf50;
            color: white;
        }

        .btn-success:hover {
            background: #45a049;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .messages {
            background: #f5f5f5;
            border-radius: 5px;
            padding: 15px;
            max-height: 400px;
            overflow-y: auto;
            margin-top: 20px;
        }

        .message {
            background: white;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            border-left: 3px solid #667eea;
        }

        .message.sent {
            border-left-color: #4caf50;
        }

        .message.received {
            border-left-color: #2196f3;
        }

        .message.error {
            border-left-color: #f44336;
            background: #ffebee;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 12px;
            color: #666;
        }

        .message-type {
            font-weight: 600;
            color: #667eea;
        }

        .message-body {
            font-size: 14px;
            color: #333;
            word-break: break-word;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }

        .stat-card {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 600;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>WebSocket 长连接客户端</h1>
            <span class="status" id="status">未连接</span>
        </div>

        <div class="content">
            <div class="form-group">
                <label>服务器地址</label>
                <input type="text" id="serverUrl" value="ws://localhost:8080/ws" placeholder="ws://localhost:8080/ws">
            </div>

            <div class="form-group">
                <label>用户ID</label>
                <input type="text" id="userId" value="user_123" placeholder="输入您的用户ID">
            </div>

            <div class="control-panel">
                <button class="btn btn-success" id="connectBtn" onclick="connect()">连接</button>
                <button class="btn btn-danger" id="disconnectBtn" onclick="disconnect()" disabled>断开</button>
            </div>

            <div class="form-group">
                <label>消息类型</label>
                <select id="messageType">
                    <option value="chat">聊天消息 (chat)</option>
                    <option value="heartbeat">心跳 (heartbeat)</option>
                    <option value="broadcast">广播 (broadcast)</option>
                    <option value="ping">Ping</option>
                </select>
            </div>

            <div class="form-group">
                <label>目标用户ID（聊天消息用）</label>
                <input type="text" id="toUserId" placeholder="输入目标用户ID">
            </div>

            <div class="form-group">
                <label>消息内容</label>
                <textarea id="messageData" placeholder='输入消息内容或JSON数据，例如: {"text": "Hello"}'></textarea>
            </div>

            <button class="btn btn-primary" id="sendBtn" onclick="sendMessage()" disabled>发送消息</button>

            <div class="stats">
                <div class="stat-card">
                    <div class="stat-value" id="sentCount">0</div>
                    <div class="stat-label">已发送</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="receivedCount">0</div>
                    <div class="stat-label">已接收</div>
                </div>
            </div>

            <div class="messages" id="messages">
                <div class="message">
                    <div class="message-header">
                        <span class="message-type">系统提示</span>
                        <span class="message-time">刚刚</span>
                    </div>
                    <div class="message-body">请输入服务器地址和用户ID，然后点击连接按钮</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let sentCount = 0;
        let receivedCount = 0;

        function updateStatus(connected) {
            const statusEl = document.getElementById('status');
            const connectBtn = document.getElementById('connectBtn');
            const disconnectBtn = document.getElementById('disconnectBtn');
            const sendBtn = document.getElementById('sendBtn');

            if (connected) {
                statusEl.textContent = '已连接';
                statusEl.className = 'status connected';
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
                sendBtn.disabled = false;
            } else {
                statusEl.textContent = '未连接';
                statusEl.className = 'status disconnected';
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
                sendBtn.disabled = true;
            }
        }

        function addMessage(type, content, direction = '') {
            const messagesEl = document.getElementById('messages');
            const messageEl = document.createElement('div');
            messageEl.className = `message ${direction}`;

            const now = new Date();
            const timeStr = now.toLocaleTimeString('zh-CN');

            messageEl.innerHTML = `
                <div class="message-header">
                    <span class="message-type">${type}</span>
                    <span class="message-time">${timeStr}</span>
                </div>
                <div class="message-body">${content}</div>
            `;

            messagesEl.appendChild(messageEl);
            messagesEl.scrollTop = messagesEl.scrollHeight;

            // 限制消息数量
            while (messagesEl.children.length > 50) {
                messagesEl.removeChild(messagesEl.firstChild);
            }
        }

        function updateStats() {
            document.getElementById('sentCount').textContent = sentCount;
            document.getElementById('receivedCount').textContent = receivedCount;
        }

        function connect() {
            const serverUrl = document.getElementById('serverUrl').value;
            const userId = document.getElementById('userId').value;

            if (!userId) {
                alert('请输入用户ID');
                return;
            }

            const url = serverUrl.includes('?') 
                ? `${serverUrl}&user_id=${userId}` 
                : `${serverUrl}?user_id=${userId}`;

            try {
                ws = new WebSocket(url);

                ws.onopen = () => {
                    updateStatus(true);
                    addMessage('系统', '连接成功！', 'received');
                };

                ws.onmessage = (event) => {
                    receivedCount++;
                    updateStats();

                    try {
                        const message = JSON.parse(event.data);
                        const content = JSON.stringify(message, null, 2);
                        addMessage(`接收: ${message.type}`, content, 'received');
                    } catch (e) {
                        addMessage('接收', event.data, 'received');
                    }
                };

                ws.onerror = (error) => {
                    addMessage('错误', `连接错误: ${error}`, 'error');
                };

                ws.onclose = () => {
                    updateStatus(false);
                    addMessage('系统', '连接已断开', 'error');
                };
            } catch (error) {
                addMessage('错误', `连接失败: ${error.message}`, 'error');
            }
        }

        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
            }
        }

        function sendMessage() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert('请先连接到服务器');
                return;
            }

            const messageType = document.getElementById('messageType').value;
            const toUserId = document.getElementById('toUserId').value;
            const messageData = document.getElementById('messageData').value;

            const message = {
                type: messageType,
                timestamp: Math.floor(Date.now() / 1000)
            };

            if (toUserId) {
                message.to = toUserId;
            }

            if (messageData) {
                try {
                    message.data = JSON.parse(messageData);
                } catch (e) {
                    message.data = { text: messageData };
                }
            } else {
                message.data = {};
            }

            try {
                ws.send(JSON.stringify(message));
                sentCount++;
                updateStats();
                addMessage(`发送: ${messageType}`, JSON.stringify(message, null, 2), 'sent');
            } catch (error) {
                addMessage('错误', `发送失败: ${error.message}`, 'error');
            }
        }

        // 快捷键支持
        document.getElementById('messageData').addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                sendMessage();
            }
        });

        // 页面关闭时断开连接
        window.addEventListener('beforeunload', () => {
            if (ws) {
                ws.close();
            }
        });
    </script>
</body>
</html>
